[package]
name = "modelprepper"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "User-owned preservation plans for open-weight models"
repository = "https://github.com/blisspixel/ModelPrepper"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
url = "2"
rusqlite = { version = "0.38", default-features = false, features = ["bundled"] }
fs4 = { version = "1.1", default-features = false }
sha1 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
