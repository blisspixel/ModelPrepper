schema_version = 1
catalog_path = "catalog"

[licenses]
allow = ["mit", "apache-2.0"]

[storage]
default_volume = "primary"
max_stored_bytes = 500_000_000_000
min_free_bytes = 20_000_000_000

[transfer]
max_transfer_bytes_per_period = 80_000_000_000
period = "utc-week"
max_parallel_files = 2

[approval]
mode = "manual"

[files]
profile = "publisher-safetensors-v1"
include_repo_code = false
include_gguf = false

[[volumes]]
label = "primary"
path = "models"

[[watches]]
source = "huggingface"
repo_type = "model"
repo_id = "example/model"
revision = "main"
update_policy = "propose"
